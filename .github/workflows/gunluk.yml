name: Gunluk Haber

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  haber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Haberleri üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: GitHub'a kaydet
        run: |
          git config user.name "muzhaber-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Günlük haber özeti"
          git push
